# --- Database (PostgreSQL in Docker, see docker-compose.yml) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=library
quarkus.datasource.password=library
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/library
# We run our own container via docker compose, so Quarkus should not start one
quarkus.datasource.devservices.enabled=false

# --- Hibernate ---
# db/init.sql owns the schema; Hibernate only checks that the entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
# Print the SQL Hibernate runs (useful for spotting N+1 queries)
quarkus.hibernate-orm.log.sql=true

# Our own exceptions have client-safe messages, so show them instead of "System error"
quarkus.smallrye-graphql.show-runtime-exception-message=graphQL.exception.NotFoundException,graphQL.exception.ValidationException,graphQL.exception.ConflictException
# Quarkus sends no error extension fields by default; include the error code from @ErrorCode
quarkus.smallrye-graphql.error-extension-fields=classification,code